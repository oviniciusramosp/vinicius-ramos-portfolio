<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <rect width="1200" height="1500" fill="#0B0F14"/>
  <rect x="48" y="48" width="1104" height="1404" rx="24" fill="none" stroke="#F0B90B" stroke-width="2" stroke-dasharray="12 12" opacity="0.45"/>
  <text x="600" y="480" text-anchor="middle" fill="#F0B90B" font-family="system-ui,sans-serif" font-size="32" font-weight="600">SHOT · app-siri</text>
  <text x="600" y="560" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="34" font-weight="600">iPhone + Siri / Apple Intelligence</text>
  <text x="600" y="640" text-anchor="middle" fill="#8B949E" font-family="system-ui,sans-serif" font-size="22">User: “Hey Siri, is this a good moment</text>
  <text x="600" y="680" text-anchor="middle" fill="#8B949E" font-family="system-ui,sans-serif" font-size="22">to accumulate Bitcoin?”</text>
  <text x="600" y="760" text-anchor="middle" fill="#F0B90B" font-family="system-ui,sans-serif" font-size="20" font-weight="600">Siri reply (use this copy)</text>
  <text x="600" y="830" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="24">“According to Crypto Bros, this looks like</text>
  <text x="600" y="880" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="24">a solid window to accumulate Bitcoin.</text>
  <text x="600" y="930" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="24">The point isn’t to catch the exact bottom,</text>
  <text x="600" y="980" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="24">but to read the indicators and build</text>
  <text x="600" y="1030" text-anchor="middle" fill="#E6EDF3" font-family="system-ui,sans-serif" font-size="24">with patience when conditions line up.”</text>
  <text x="600" y="1120" text-anchor="middle" fill="#484F58" font-family="system-ui,sans-serif" font-size="18">education · indicators · no timing the bottom · replace me</text>
</svg>
